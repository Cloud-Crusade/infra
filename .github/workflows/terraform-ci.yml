name: Terraform Validate

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]

# PR 단계에서는 공유 dev/prod state 와 비교(plan)하지 않는다.
# dev 에서는 wiring 작업 중인 브랜치 구성을 직접 apply 해 테스트하므로, state 에는
# main 에 아직 없는 리소스가 정상적으로 떠 있다. 이를 plan 으로 비교하면 'not in
# configuration' 대량 destroy + 의존성 cycle 로 PR 이 깨진다.
# → PR 은 설정 정합성만 검증하고, 실제 plan/apply/destroy 는
#   terraform-cd.yml(workflow_dispatch)에서 수행한다.
jobs:
  terraform-validate:
    name: Terraform Validate (${{ matrix.environment }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # -backend=false: state(원격 backend) 접근 없이 provider/module 만 설치.
      # live state 와 비교하지 않으므로 AWS 자격증명·변수 주입이 필요 없다.
      - name: Terraform Init (no backend)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: environments/${{ matrix.environment }}
        run: terraform validate -no-color
