name: Terraform Check

on:
  pull_request:
    branches: ["**"]
    types: [opened, synchronize, reopened]

jobs:
  terraform-check:
    name: Terraform Check (${{ matrix.environment }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}

    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 빈 state plan 이라도 data source(예: aws_ami) 평가에 자격증명이 필요.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # GitHub secrets/variables → TF_VAR_<소문자키> 매핑 (apply 와 동일한 변수 소스).
      # secrets/vars 로 주입되는 변수까지 포함해 누락 여부를 정확히 판정.
      - name: Map secrets/variables to TF_VAR_
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
        run: |
          to_tfvars() {
            jq -r 'to_entries[]
              | "TF_VAR_\(.key | ascii_downcase)<<__TFVAR_EOF__\n\(.value)\n__TFVAR_EOF__"'
          }
          printf '%s' "$SECRETS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"
          printf '%s' "$VARS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"

      # 공유 원격 state 격리: backend 설정을 제거해 빈 로컬 state 를 쓰게 한다.
      - name: Isolate backend (clean-room)
        working-directory: environments/${{ matrix.environment }}
        run: rm -f backend.tf

      - name: Terraform Init (local empty state)
        working-directory: environments/${{ matrix.environment }}
        run: terraform init -input=false

      # -input=false: required 변수 값이 없으면 즉시 실패(apply 시 확정 에러를 선검출).
      # 빈 state 라 전부 create 로만 계획 → destroy/cycle 없음, 공유 state 미접근.
      # enable_nlb_binding 은 강제 off — kubernetes_manifest(nlb_binding)는 plan 시 클러스터 접속이
      # 필요한데 clean-room 엔 클러스터가 없어 실패. TF_VAR_ 는 미선언 변수면 무시되므로 prod
      # (변수 미선언)에도 안전하고, dev 의 ENABLE_NLB_BINDING=true 를 이 스텝에서만 덮어쓴다.
      - name: Terraform Plan (clean-room)
        working-directory: environments/${{ matrix.environment }}
        env:
          TF_VAR_enable_nlb_binding: "false"
        run: terraform plan -input=false -no-color
