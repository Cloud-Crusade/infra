name: Terraform Apply / Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 대상 환경
        type: choice
        options:
          - dev
          - prod
      action:
        description: 실행 작업
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # GitHub secrets/variables → TF_VAR_<소문자키> 매핑 (terraform 변수 주입)
      - name: Map secrets/variables to TF_VAR_
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
        run: |
          to_tfvars() {
            jq -r 'to_entries[]
              | "TF_VAR_\(.key | ascii_downcase)<<__TFVAR_EOF__\n\(.value)\n__TFVAR_EOF__"'
          }
          printf '%s' "$SECRETS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"
          printf '%s' "$VARS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: environments/${{ inputs.environment }}
        run: terraform apply -auto-approve -input=false -lock-timeout=5m

      # destroy: ①람다 먼저 → ②lambda SG ENI 강제 분리·삭제 → ③전체.
      # VPC 람다 ENI 가 분리 안 된 채 잔존하면 SG·서브넷 삭제를 DependencyViolation 으로 장시간 막음
      - name: Terraform destroy (staged)
        if: inputs.action == 'destroy'
        working-directory: environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          SG_ID="$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=*-${{ inputs.environment }}-lambda-sg" \
            --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || true)"

          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            echo "staged destroy — lambda SG: $SG_ID"
            terraform destroy -target=module.lambda -auto-approve -input=false -lock-timeout=5m

            deadline=$(( $(date +%s) + 1800 ))
            while :; do
              ids="$(aws ec2 describe-network-interfaces \
                --filters "Name=group-id,Values=$SG_ID" \
                --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
              [ -z "$ids" ] && { echo "ENI 정리 완료"; break; }
              for eni in $ids; do
                attach="$(aws ec2 describe-network-interfaces --network-interface-ids "$eni" \
                  --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text)"
                if [ -n "$attach" ] && [ "$attach" != "None" ]; then
                  # 관리형(Hyperplane) ENI 면 강제 분리가 거부됨 → AWS 회수 폴링으로 강등
                  aws ec2 detach-network-interface --attachment-id "$attach" --force 2>/dev/null \
                    && echo "ENI $eni 강제 분리 요청" || echo "ENI $eni 관리형 — 분리 불가, AWS 회수 대기"
                fi
                aws ec2 delete-network-interface --network-interface-id "$eni" 2>/dev/null \
                  && echo "ENI $eni 삭제" || true
              done
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::warning::ENI 잔존 타임아웃 — SG 를 state 에서 분리(폴백), 회수 후 수동 정리 필요"
                terraform state rm 'module.security_groups.aws_security_group.lambda' || true
                break
              fi
              sleep 30
            done
          fi

          terraform destroy -auto-approve -input=false -lock-timeout=5m
