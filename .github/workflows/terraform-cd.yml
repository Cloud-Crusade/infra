name: Terraform Apply / Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 대상 환경
        type: choice
        options:
          - dev
          - prod
      action:
        description: 실행 작업
        type: choice
        options:
          - apply
          - destroy
      api_backend:
        description: API GW 백엔드 (dev apply 전용 — prod 는 무시)
        type: choice
        default: eks
        options:
          - eks
          - test_ec2
      extra_apply_args:
        description: apply 추가 인자 (targeted/복구용, 예 "-refresh=false -replace=...")
        type: string
        default: ""

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # GitHub secrets/variables → TF_VAR_<소문자키> 매핑 (terraform 변수 주입)
      - name: Map secrets/variables to TF_VAR_
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
        run: |
          to_tfvars() {
            jq -r 'to_entries[]
              | "TF_VAR_\(.key | ascii_downcase)<<__TFVAR_EOF__\n\(.value)\n__TFVAR_EOF__"'
          }
          printf '%s' "$SECRETS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"
          printf '%s' "$VARS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -input=false

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: environments/${{ inputs.environment }}
        # 워크플로우 입력으로 백엔드 선택(step env 가 GitHub vars 매핑보다 우선). prod 는 변수 미선언이라 무시
        env:
          TF_VAR_api_backend: ${{ inputs.api_backend }}
        # dev + eks: 2단계 apply — kubernetes_manifest(nlb_binding)는 클러스터/CRD 존재 후에만 plan 가능.
        # 1단계 바인딩 off 로 클러스터·컨트롤러 생성 → 2단계 바인딩 on 으로 TargetGroupBinding 생성.
        # test_ec2 는 바인딩 불필요(단일, off). prod 는 enable_nlb_binding 미선언이라 -var 미사용.
        run: |
          set -e
          COMMON="-auto-approve -input=false -lock-timeout=5m ${{ inputs.extra_apply_args }}"
          if [ "${{ inputs.environment }}" = "dev" ] && [ "${{ inputs.api_backend }}" = "eks" ]; then
            echo "::group::Stage 1/2 — enable_nlb_binding=false (클러스터·컨트롤러 생성)"
            TF_VAR_enable_nlb_binding=false terraform apply $COMMON
            echo "::endgroup::"
            echo "::group::Stage 2/2 — enable_nlb_binding=true (TargetGroupBinding 생성)"
            TF_VAR_enable_nlb_binding=true terraform apply $COMMON
            echo "::endgroup::"
          elif [ "${{ inputs.environment }}" = "dev" ]; then
            echo "dev/test_ec2 — 단일 apply (NLB 바인딩 비활성)"
            TF_VAR_enable_nlb_binding=false terraform apply $COMMON
          else
            echo "${{ inputs.environment }} — 단일 apply"
            terraform apply $COMMON
          fi

      # destroy 는 ①람다 → ②ENI drain → ③전체 의 staged 단계로 분리.
      # VPC 람다 ENI 가 분리 안 된 채 잔존하면 SG·서브넷 삭제를 DependencyViolation 으로 장시간 막음

      # lambda SG 를 state 에서 결정적으로 식별(이름 추정·와일드카드 회피). 없으면(prod 등) staged 단계 생략
      - name: Resolve Lambda security group
        id: lambda_sg
        if: inputs.action == 'destroy'
        working-directory: environments/${{ inputs.environment }}
        env:
          SG_ADDR: module.security_groups.aws_security_group.lambda
        run: |
          set -euo pipefail
          if ! terraform state list | grep -qx "$SG_ADDR"; then
            echo "lambda SG 없음 — staged 단계 생략"
            echo "sg_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sg_id="$(terraform state show -no-color "$SG_ADDR" \
            | awk -F'"' '/^[[:space:]]+id[[:space:]]+=/ {print $2; exit}')"
          [ -n "$sg_id" ] || { echo "::error::lambda SG id 파싱 실패"; exit 1; }
          echo "lambda SG: $sg_id"
          echo "sg_id=$sg_id" >> "$GITHUB_OUTPUT"

      # ① VPC 연결 람다부터 제거 → AWS 가 ENI 회수 시작
      - name: Destroy Lambda first
        if: inputs.action == 'destroy' && steps.lambda_sg.outputs.sg_id != ''
        working-directory: environments/${{ inputs.environment }}
        run: terraform destroy -target=module.lambda -auto-approve -input=false -lock-timeout=5m

      # ② lambda SG 의 VPC Lambda ENI(interface-type=lambda) 강제 분리·삭제.
      # 관리형(Hyperplane)이면 분리가 거부되므로 AWS 회수 폴링, 30분 타임아웃 시 state rm 폴백
      - name: Drain Lambda ENIs
        if: inputs.action == 'destroy' && steps.lambda_sg.outputs.sg_id != ''
        env:
          SG_ID: ${{ steps.lambda_sg.outputs.sg_id }}
          SG_ADDR: module.security_groups.aws_security_group.lambda
        working-directory: environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            ids="$(aws ec2 describe-network-interfaces \
              --filters "Name=group-id,Values=$SG_ID" "Name=interface-type,Values=lambda" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
            [ -z "$ids" ] && { echo "ENI 정리 완료"; break; }
            for eni in $ids; do
              attach="$(aws ec2 describe-network-interfaces --network-interface-ids "$eni" \
                --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text)"
              if [ -n "$attach" ] && [ "$attach" != "None" ]; then
                aws ec2 detach-network-interface --attachment-id "$attach" --force 2>/dev/null \
                  && echo "ENI $eni 강제 분리 요청" || echo "ENI $eni 관리형 — 분리 불가, AWS 회수 대기"
              fi
              aws ec2 delete-network-interface --network-interface-id "$eni" 2>/dev/null \
                && echo "ENI $eni 삭제" || true
            done
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::ENI 잔존 타임아웃 — SG 를 state 에서 분리(폴백), 회수 후 수동 정리 필요"
              terraform state rm "$SG_ADDR" || true
              break
            fi
            sleep 30
          done

      # ③ 나머지(또는 SG 없으면 전체) destroy — SG 가 막힘 없이 삭제됨
      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: environments/${{ inputs.environment }}
        run: terraform destroy -auto-approve -input=false -lock-timeout=5m
