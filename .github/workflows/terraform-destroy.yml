name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 대상 환경
        type: choice
        options:
          - dev
          - prod

jobs:
  destroy:
    name: Terraform Destroy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # GitHub secrets/variables → TF_VAR_<소문자키> 매핑 (terraform 변수 주입)
      - name: Map secrets/variables to TF_VAR_
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
          VARS_CONTEXT: ${{ toJSON(vars) }}
        run: |
          to_tfvars() {
            jq -r 'to_entries[]
              | "TF_VAR_\(.key | ascii_downcase)<<__TFVAR_EOF__\n\(.value)\n__TFVAR_EOF__"'
          }
          printf '%s' "$SECRETS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"
          printf '%s' "$VARS_CONTEXT" | to_tfvars >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: environments/${{ inputs.environment }}
        run: terraform init -input=false

      # destroy 는 ①람다 → ②ENI drain → ③finalizer → ④전체 의 staged 단계로 분리.
      # VPC 람다 ENI 가 분리 안 된 채 잔존하면 SG·서브넷 삭제를 DependencyViolation 으로 장시간 막음

      # lambda SG 를 state 에서 결정적으로 식별(이름 추정·와일드카드 회피). 없으면(prod 등) staged 단계 생략
      - name: Resolve Lambda security group
        id: lambda_sg
        working-directory: environments/${{ inputs.environment }}
        env:
          SG_ADDR: module.security_groups.aws_security_group.lambda
        run: |
          set -euo pipefail
          if ! terraform state list | grep -qx "$SG_ADDR"; then
            echo "lambda SG 없음 — staged 단계 생략"
            echo "sg_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sg_id="$(terraform state show -no-color "$SG_ADDR" \
            | awk -F'"' '/^[[:space:]]+id[[:space:]]+=/ {print $2; exit}')"
          [ -n "$sg_id" ] || { echo "::error::lambda SG id 파싱 실패"; exit 1; }
          echo "lambda SG: $sg_id"
          echo "sg_id=$sg_id" >> "$GITHUB_OUTPUT"

      # ① VPC 연결 람다부터 제거 → AWS 가 ENI 회수 시작
      - name: Destroy Lambda first
        if: steps.lambda_sg.outputs.sg_id != ''
        working-directory: environments/${{ inputs.environment }}
        run: terraform destroy -target=module.lambda -auto-approve -input=false -lock-timeout=5m

      # ② lambda SG 의 VPC Lambda ENI(interface-type=lambda) 강제 분리·삭제.
      # 관리형(Hyperplane)이면 분리가 거부되므로 AWS 회수 폴링, 30분 타임아웃 시 state rm 폴백
      - name: Drain Lambda ENIs
        if: steps.lambda_sg.outputs.sg_id != ''
        env:
          SG_ID: ${{ steps.lambda_sg.outputs.sg_id }}
          SG_ADDR: module.security_groups.aws_security_group.lambda
        working-directory: environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            ids="$(aws ec2 describe-network-interfaces \
              --filters "Name=group-id,Values=$SG_ID" "Name=interface-type,Values=lambda" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
            [ -z "$ids" ] && { echo "ENI 정리 완료"; break; }
            for eni in $ids; do
              attach="$(aws ec2 describe-network-interfaces --network-interface-ids "$eni" \
                --query 'NetworkInterfaces[0].Attachment.AttachmentId' --output text)"
              if [ -n "$attach" ] && [ "$attach" != "None" ]; then
                aws ec2 detach-network-interface --attachment-id "$attach" --force 2>/dev/null \
                  && echo "ENI $eni 강제 분리 요청" || echo "ENI $eni 관리형 — 분리 불가, AWS 회수 대기"
              fi
              aws ec2 delete-network-interface --network-interface-id "$eni" 2>/dev/null \
                && echo "ENI $eni 삭제" || true
            done
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::ENI 잔존 타임아웃 — SG 를 state 에서 분리(폴백), 회수 후 수동 정리 필요"
              terraform state rm "$SG_ADDR" || true
              break
            fi
            sleep 30
          done

      # ③ LB Controller 관리 리소스 정리 — teardown 중 컨트롤러가 finalizer 를 재추가해
      # kubernetes_manifest(nlb_binding) 삭제가 무한 대기하는 교착 방지.
      # patch-only 는 컨트롤러가 곧바로 finalizer 를 재추가하므로 무효 → "delete + finalizer 제거"로
      # TargetGroupBinding 을 terraform destroy 전에 실제로 제거(terraform 생성 TGB 는 컨트롤러가
      # 재생성하지 않으므로 유지됨). 어차피 NLB·타겟그룹도 삭제되므로 정상 해제는 불필요. 클러스터 부재 시 생략.
      - name: Strip LB controller finalizers
        continue-on-error: true
        run: |
          set +e
          CL="$(aws eks list-clusters --query "clusters[?ends_with(@, '-${{ inputs.environment }}-eks')] | [0]" --output text 2>/dev/null)"
          if [ -z "$CL" ] || [ "$CL" = "None" ]; then echo "EKS 클러스터 없음 — 생략"; exit 0; fi
          aws eks update-kubeconfig --name "$CL" >/dev/null 2>&1 || { echo "kubeconfig 실패 — 생략"; exit 0; }
          # 삭제 표시(deletionTimestamp) 후 finalizer 제거 → terminating 객체가 즉시 사라짐(컨트롤러 재추가 차단)
          kubectl delete targetgroupbinding -A --all --wait=false 2>/dev/null
          kubectl get targetgroupbinding -A --no-headers 2>/dev/null | awk '{print $1, $2}' \
          | while read -r ns name; do
              [ -z "$name" ] && continue
              kubectl patch targetgroupbinding "$name" -n "$ns" --type=merge \
                -p '{"metadata":{"finalizers":null}}' 2>/dev/null && echo "TGB 정리: $ns/$name"
            done
          # LoadBalancer 타입 Service(예: prometheus internal NLB) 는 삭제 → 살아있는 컨트롤러가 NLB·SG 정상 정리.
          # (finalizer patch 로 서비스만 지우면 NLB 가 고아로 남아 서브넷/VPC 삭제 차단). 타임아웃 시 finalizer 폴백(백스톱이 NLB 정리)
          kubectl get svc -A --no-headers -o custom-columns=NS:.metadata.namespace,N:.metadata.name,T:.spec.type 2>/dev/null \
          | awk '$3=="LoadBalancer"{print $1, $2}' \
          | while read -r ns name; do
              [ -z "$name" ] && continue
              kubectl delete svc "$name" -n "$ns" --wait=true --timeout=120s 2>/dev/null \
                && echo "LB svc 삭제(컨트롤러 NLB 정리): $ns/$name" \
                || { kubectl patch svc "$name" -n "$ns" --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null; echo "LB svc finalizer 폴백: $ns/$name"; }
            done
          echo "finalizer 정리 완료"

      # ④ 전체 destroy — 실패 시 EKS 고아 리소스(클러스터 삭제 후 잔존) 정리 후 1회 재시도.
      # EKS 가 자동 생성하는 CNI 보조 ENI(aws-K8S-*, available) 와 클러스터 SG(eks-cluster-sg-*,
      # aws:eks:cluster-name 태그)는 terraform 미관리라 클러스터 삭제 후 고아로 남아 서브넷/VPC
      # 삭제를 DependencyViolation 으로 막음 → 정리 후 재시도하면 통과.
      - name: Terraform destroy
        working-directory: environments/${{ inputs.environment }}
        run: |
          set +e
          terraform destroy -auto-approve -input=false -lock-timeout=5m && exit 0
          echo "::warning::1차 destroy 실패 — EKS 고아 ENI/SG 정리 후 재시도"
          VPC="$(terraform state pull | jq -r '[.resources[]|select(.type=="aws_vpc")][0].instances[0].attributes.id // empty')"
          if [ -n "$VPC" ]; then
            echo "VPC=$VPC 고아 리소스 정리"
            # 고아 LB(컨트롤러 미정리 NLB, 예: prometheus) 삭제 → in-use ENI 해제
            for lb in $(aws elbv2 describe-load-balancers --query "LoadBalancers[?VpcId=='$VPC'].LoadBalancerArn" --output text 2>/dev/null); do
              aws elbv2 delete-load-balancer --load-balancer-arn "$lb" 2>/dev/null && echo "LB 삭제: $lb"
            done
            sleep 45  # NLB ENI 해제 대기
            # CNI 보조 ENI(available) 삭제
            for eni in $(aws ec2 describe-network-interfaces --filters "Name=vpc-id,Values=$VPC" "Name=status,Values=available" --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null); do
              aws ec2 delete-network-interface --network-interface-id "$eni" 2>/dev/null && echo "ENI 삭제: $eni"
            done
            # EKS·LB Controller 소유 고아 SG(terraform 미관리) 삭제 — 상호 참조 대비 2회
            for pass in 1 2; do
              for tagkey in aws:eks:cluster-name elbv2.k8s.aws/cluster; do
                for sg in $(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$VPC" "Name=tag-key,Values=$tagkey" --query 'SecurityGroups[].GroupId' --output text 2>/dev/null); do
                  aws ec2 delete-security-group --group-id "$sg" 2>/dev/null && echo "SG 삭제(pass$pass): $sg"
                done
              done
            done
          fi
          set -e
          terraform destroy -auto-approve -input=false -lock-timeout=5m
